# compose.frontend.yml — Frontend stack (React SPA + Caddy)
#
# Includes: Frontend + Caddy. Não depende da API para iniciar; o Nginx faz
# proxy de /api em tempo de request.
#
# Usage:
#   docker compose -f compose.yml -f compose.frontend.yml up -d   # Frontend + Caddy
#   docker compose -f compose.frontend.yml up -d                  # autossuficiente (cria rede)
#   docker compose -f compose.frontend.yml up -d --no-deps frontend  # reinicia só o frontend
#
# Não usa `profiles`: incluí-lo no -f já significa subir a stack.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        NGINX_VERSION: ${NGINX_VERSION:-1.28}
    image: time-tracker-frontend:latest
    container_name: time-tracker-frontend
    restart: unless-stopped
    ports:
      # Dev stack only — produção usa compose.yaml (sem portas publicadas).
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - time-tracker-net
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE

  caddy:
    image: caddy:2-alpine
    container_name: time-tracker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - time-tracker-net
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  time-tracker-net:
    name: time-tracker-network
    driver: bridge

volumes:
  caddy_data:
    name: time-tracker-caddy-data
  caddy_config:
    name: time-tracker-caddy-config
