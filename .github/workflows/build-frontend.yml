# Build & Publish Frontend Image
#
# Builds multi-arch Docker image for the Frontend and pushes to GHCR.
# Triggered only when frontend/** files change.
#
# Platforms: linux/amd64 and linux/arm64

name: Build Frontend Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
      - "docker-bake.hcl"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
      - "docker-bake.hcl"
  workflow_dispatch:
    inputs:
      push:
        description: Push images to registry
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-frontend:
    name: Frontend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/time-tracker-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
