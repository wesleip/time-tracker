# Build & Publish API Image
#
# Builds multi-arch Docker image for the API and pushes to DockerHub.
# Triggered only when api/** files change.
#
# Platforms: linux/amd64 and linux/arm64

name: Build API Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "api/**"
      - ".github/workflows/build-api.yml"
      - "docker-bake.hcl"
  pull_request:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/build-api.yml"
      - "docker-bake.hcl"
  workflow_dispatch:
    inputs:
      push:
        description: Push images to registry
        type: boolean
        default: false

jobs:
  build-api:
    name: API Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/time-tracker-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
