# CI — Continuous Integration
#
# Runs on every push to main and on every pull request targeting main
# when API or frontend source files change. Validates that the backend test
# suite passes and that the frontend lints and type-checks, before any image
# build or deployment is triggered.
#
# Test isolation: uses SQLite in-memory (StaticPool) defined in
# api/tests/conftest.py — no external PostgreSQL service required.

name: CI

on:
  push:
    branches: ["main"]
    paths: ["api/**", "frontend/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["api/**", "frontend/**", ".github/workflows/ci.yml"]

jobs:
  test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short
        env:
          # Tests override the DB with SQLite in-memory (see conftest.py).
          # These values are required by pydantic-settings config validation
          # but are not used to connect to a real database during tests.
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-only-secret-not-used-in-production"
          CORS_ORIGINS: "http://localhost:3000"

  frontend:
    name: Frontend Lint and Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: ["24"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build
