# compose.api.yml — API stack (FastAPI backend)
#
# Includes: API service + DB (extends compose.yml)
#
# Usage:
#   docker compose -f compose.yml -f compose.api.yml up -d            # API + DB
#   docker compose -f compose.yml -f compose.api.yml -f compose.dev.yaml up -d  # + portas de dev
#   docker compose -f compose.api.yml up -d                           # autossuficiente (cria rede e volume)
#   docker compose -f compose.api.yml up -d --no-deps api             # reinicia só a API
#
# Não usa `profiles`: incluí-lo no -f já significa subir a stack.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: time-tracker-api:latest
    container_name: time-tracker-api
    restart: unless-stopped
    ports:
      # Dev stack only — produção usa compose.yaml (sem portas publicadas).
      - "3001:3001"
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - time-tracker-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    extends:
      file: compose.yml
      service: db

networks:
  time-tracker-net:
    name: time-tracker-network
    driver: bridge

volumes:
  pgdata:
    name: time-tracker-pgdata
