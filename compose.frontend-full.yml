# compose.frontend-full.yml — Frontend with API dependency (for full stack)
#
# This file adds API dependency to frontend when running the complete stack.
# Use with: docker compose -f compose.yml -f compose.api.yml -f compose.frontend-full.yml up -d
#
# Or via Makefile: make up

services:
  frontend:
    depends_on:
      api:
        condition: service_healthy
